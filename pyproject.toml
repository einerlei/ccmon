[project]
name = "ccmon"
version = "0.5.7"
description = "Terminal monitor for Claude Code sessions and subagents"
authors = [
    {name = "einerlei", email = "31n34731@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "textual>=8.2.5,<9.0.0"
]

[project.urls]
Homepage = "https://github.com/einerlei/ccmon"
Repository = "https://github.com/einerlei/ccmon"
Changelog = "https://github.com/einerlei/ccmon/blob/main/CHANGELOG.md"

[project.scripts]
ccmon = "ccmon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["ccmon.py"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pyright>=1.1",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
